name: Refresh JTclima feed
on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 06:30 Sofia (summer) / 05:30 (winter)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed
        run: python build_feed.py
      - name: Record run (keeps the schedule alive; GitHub pauses scheduled jobs after 60 days without commits)
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > feed/last_run.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          git commit -m "Refresh feed $(date -u +%F)" || echo "nothing to commit"
          git push
